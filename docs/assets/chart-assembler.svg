<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500"
     role="img" aria-label="basalt's assembler reproduces 59,693 of 59,760 corpus instructions exactly, 99.9 percent, refusing 67 by name. It reproduces 4,585,336 of 5,237,448 shipped library instructions exactly, 87.5 percent, refusing 652,112 by name. Across all 5,297,208 instructions it has assembled zero to the wrong bytes.">
  <title>Coverage against correctness</title>

  <defs>
    <pattern id="cols" width="112" height="130" patternUnits="userSpaceOnUse"
             patternTransform="translate(-18 -34)">
      <g fill="#151b23" stroke="#2b3542" stroke-width="1.4">
        <path d="M56 2 L106 30.5 L106 87.5 L56 116 L6 87.5 L6 30.5 Z"/>
        <path d="M0 67 L50 95.5 L50 152.5 L0 181 L-50 152.5 L-50 95.5 Z"/>
        <path d="M112 67 L162 95.5 L162 152.5 L112 181 L62 152.5 L62 95.5 Z"/>
      </g>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.40" stop-color="#000000"/>
      <stop offset="0.74" stop-color="#4c4c4c"/>
      <stop offset="0.99" stop-color="#a8a8a8"/>
    </linearGradient>
    <mask id="fadeMask"><rect width="1200" height="150" fill="url(#fade)"/></mask>
    <radialGradient id="glow" cx="0.14" cy="0.5" r="0.85">
      <stop offset="0" stop-color="#1b2531" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6e831"/><stop offset="1" stop-color="#76b900"/>
    </linearGradient>

    <style>
      .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .eyebrow { font-size: 12px; font-weight: 600; fill: #6e7781; letter-spacing: 2.2px; }
      .title   { font-size: 29px; font-weight: 700; fill: #e6edf3; letter-spacing: -0.9px; }
      .lede    { font-size: 15px; fill: #8b949e; }
      .mark    { font-size: 19px; font-weight: 700; fill: #5c7086; letter-spacing: -0.6px; }
      .colhead { font-size: 11px; font-weight: 600; letter-spacing: 1.4px; }
      .row     { font-size: 16px; font-weight: 700; fill: #e6edf3; }
      .rowsub  { font-size: 12.5px; fill: #6e7781; }
      .inbar   { font-size: 15px; font-weight: 700; }
      .refused { font-size: 14px; font-weight: 600; fill: #8b949e; }
      .zero    { font-size: 46px; font-weight: 700; fill: #a6e831; letter-spacing: -1.5px; }
      .lead    { font-size: 15.5px; font-weight: 600; fill: #e6edf3; }
      .sub     { font-size: 13.5px; fill: #8b949e; }
      .note    { font-size: 12.5px; fill: #6e7781; }
    </style>
  </defs>

  <rect width="1200" height="500" fill="#0d1117"/>
  <rect width="1200" height="150" fill="url(#glow)"/>
  <rect width="1200" height="150" fill="url(#cols)" mask="url(#fadeMask)"/>
  <rect x="0" y="0" width="5" height="500" fill="url(#ok)"/>

  <text x="52" y="52" class="mono eyebrow">THE ASSEMBLER &#183; TWO DIFFERENT NUMBERS</text>
  <text x="52" y="92" class="sans title">Coverage is what it can do. Correctness is what it never gets wrong.</text>
  <text x="52" y="120" class="sans lede">Every instruction is reassembled and compared against the vendor compiler&#8217;s exact 128 bits.</text>
  <text x="1148" y="92" class="sans mark" text-anchor="end">basalt</text>
  <line x1="0" y1="150" x2="1200" y2="150" stroke="#2b3542"/>

  <text x="320" y="194" class="mono colhead" fill="#a6e831">ASSEMBLED TO THE VENDOR&#8217;S EXACT BYTES</text>
  <text x="1148" y="194" class="mono colhead" fill="#6e7781" text-anchor="end">REFUSED BY NAME</text>

  <text x="296" y="234" class="sans row" text-anchor="end">corpus</text>
  <text x="296" y="254" class="mono rowsub" text-anchor="end">59,760 instructions</text>
  <rect x="320" y="212" width="690" height="44" rx="2" fill="#151b23"/>
  <rect x="320" y="212" width="689.2" height="44" rx="2" fill="url(#ok)"/>
  <text x="338" y="240" class="mono inbar" fill="#0d1117">59,693 exact</text>
  <text x="991.2" y="240" class="mono inbar" fill="#1a2b00" text-anchor="end">99.9%</text>
  <text x="1148" y="240" class="mono refused" text-anchor="end">67</text>

  <text x="296" y="306" class="sans row" text-anchor="end">shipped libraries</text>
  <text x="296" y="326" class="mono rowsub" text-anchor="end">5,237,448 instructions</text>
  <rect x="320" y="284" width="690" height="44" rx="2" fill="#151b23"/>
  <rect x="320" y="284" width="604.1" height="44" rx="2" fill="url(#ok)"/>
  <text x="338" y="312" class="mono inbar" fill="#0d1117">4,585,336 exact</text>
  <text x="906.1" y="312" class="mono inbar" fill="#1a2b00" text-anchor="end">87.5%</text>
  <text x="1148" y="312" class="mono refused" text-anchor="end">652,112</text>

  <line x1="52" y1="372" x2="1148" y2="372" stroke="#1c232c"/>
  <text x="52" y="424" class="mono zero">0</text>
  <text x="102" y="408" class="sans lead">instructions assembled to the wrong bytes, across 5,297,208 instructions of vendor output.</text>
  <text x="102" y="430" class="sans sub">Every refusal names the field it could not place; a tool that guessed would reach full coverage by emitting words that compute something else.</text>

  <line x1="52" y1="456" x2="1148" y2="456" stroke="#1c232c"/>
  <text x="52" y="480" class="mono note">python scripts/assembler_coverage.py --cubins &lt;dir&gt; --show-refusals</text>
  <text x="1148" y="480" class="sans note" font-weight="700" text-anchor="end">agree with the vendor exactly, or say why not</text>
</svg>
