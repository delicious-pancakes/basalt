<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540"
     role="img" aria-label="Three latencies basalt assumed before measuring them, against what the silicon reported. fp64 add was assumed 48 cycles and measured 64. POPC was assumed 4 and measured 18. The I2FP plus F2I conversion round trip was assumed 12 and measured 24.">
  <title>Assumed against measured</title>

  <defs>
    <pattern id="cols" width="112" height="130" patternUnits="userSpaceOnUse"
             patternTransform="translate(-18 -34)">
      <g fill="#151b23" stroke="#2b3542" stroke-width="1.4">
        <path d="M56 2 L106 30.5 L106 87.5 L56 116 L6 87.5 L6 30.5 Z"/>
        <path d="M0 67 L50 95.5 L50 152.5 L0 181 L-50 152.5 L-50 95.5 Z"/>
        <path d="M112 67 L162 95.5 L162 152.5 L112 181 L62 152.5 L62 95.5 Z"/>
      </g>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.40" stop-color="#000000"/>
      <stop offset="0.74" stop-color="#4c4c4c"/>
      <stop offset="0.99" stop-color="#a8a8a8"/>
    </linearGradient>
    <mask id="fadeMask"><rect width="1200" height="150" fill="url(#fade)"/></mask>
    <radialGradient id="glow" cx="0.14" cy="0.5" r="0.85">
      <stop offset="0" stop-color="#1b2531" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6e831"/><stop offset="1" stop-color="#76b900"/>
    </linearGradient>

    <style>
      .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .eyebrow { font-size: 12px; font-weight: 600; fill: #6e7781; letter-spacing: 2.2px; }
      .title   { font-size: 29px; font-weight: 700; fill: #e6edf3; letter-spacing: -0.9px; }
      .lede    { font-size: 15px; fill: #8b949e; }
      .mark    { font-size: 19px; font-weight: 700; fill: #5c7086; letter-spacing: -0.6px; }
      .axis    { font-size: 12.5px; fill: #6e7781; }
      .val     { font-size: 17px; font-weight: 700; }
      .leg     { font-size: 12.5px; font-weight: 600; }
      .op      { font-size: 15px; font-weight: 700; fill: #e6edf3; }
      .opsub   { font-size: 12.5px; fill: #6e7781; }
      .fac     { font-size: 13.5px; font-weight: 700; fill: #d29922; }
      .note    { font-size: 12.5px; fill: #6e7781; }
    </style>
  </defs>

  <rect width="1200" height="540" fill="#0d1117"/>
  <rect width="1200" height="150" fill="url(#glow)"/>
  <rect width="1200" height="150" fill="url(#cols)" mask="url(#fadeMask)"/>
  <rect x="0" y="0" width="5" height="540" fill="url(#ok)"/>

  <text x="52" y="52" class="mono eyebrow">FINDING 4 &#183; CHAIN TIMING ON SILICON</text>
  <text x="52" y="92" class="sans title">An assumed latency model is not a small approximation of a measured one</text>
  <text x="52" y="120" class="sans lede">The three the shipped assumptions got wrong, in cycles. Every fit R&#178; &#8805; 0.9998.</text>
  <text x="1148" y="92" class="sans mark" text-anchor="end">basalt</text>
  <line x1="0" y1="150" x2="1200" y2="150" stroke="#2b3542"/>

  <g stroke="#1c232c">
    <line x1="192" y1="400" x2="1148" y2="400"/>
    <line x1="192" y1="342.9" x2="1148" y2="342.9"/>
    <line x1="192" y1="285.7" x2="1148" y2="285.7"/>
    <line x1="192" y1="228.6" x2="1148" y2="228.6"/>
    <line x1="526.7" y1="170" x2="526.7" y2="400"/>
    <line x1="837.3" y1="170" x2="837.3" y2="400"/>
  </g>
  <g class="mono axis" text-anchor="end">
    <text x="180" y="404.5">0</text>
    <text x="180" y="347.4">20</text>
    <text x="180" y="290.2">40</text>
    <text x="180" y="233.1">60</text>
  </g>

  <rect x="270.3" y="262.9" width="90" height="137.1" rx="2" fill="#33415a"/>
  <rect x="382.3" y="217.1" width="90" height="182.9" rx="2" fill="url(#ok)"/>
  <text x="315.3" y="251.9" class="mono val" fill="#8b949e" text-anchor="middle">48</text>
  <text x="427.3" y="206.1" class="mono val" fill="#e6edf3" text-anchor="middle">64</text>
  <text x="315.3" y="425" class="sans leg" fill="#6e7781" text-anchor="middle">assumed</text>
  <text x="427.3" y="425" class="sans leg" fill="#a6e831" text-anchor="middle">measured</text>
  <text x="371.3" y="457" class="mono op" text-anchor="middle">DADD &#183; DFMA</text>
  <text x="371.3" y="477" class="sans opsub" text-anchor="middle">fp64 add</text>
  <text x="371.3" y="188" class="mono fac" text-anchor="middle">&#215;1.3</text>

  <rect x="581.0" y="388.6" width="90" height="11.4" rx="2" fill="#33415a"/>
  <rect x="693.0" y="348.6" width="90" height="51.4" rx="2" fill="url(#ok)"/>
  <text x="626.0" y="377.6" class="mono val" fill="#8b949e" text-anchor="middle">4</text>
  <text x="738.0" y="337.6" class="mono val" fill="#e6edf3" text-anchor="middle">18</text>
  <text x="626.0" y="425" class="sans leg" fill="#6e7781" text-anchor="middle">assumed</text>
  <text x="738.0" y="425" class="sans leg" fill="#a6e831" text-anchor="middle">measured</text>
  <text x="682.0" y="457" class="mono op" text-anchor="middle">POPC</text>
  <text x="682.0" y="477" class="sans opsub" text-anchor="middle">population count</text>
  <text x="682.0" y="188" class="mono fac" text-anchor="middle">&#215;4.5</text>

  <rect x="891.7" y="365.7" width="90" height="34.3" rx="2" fill="#33415a"/>
  <rect x="1003.7" y="331.4" width="90" height="68.6" rx="2" fill="url(#ok)"/>
  <text x="936.7" y="354.7" class="mono val" fill="#8b949e" text-anchor="middle">12</text>
  <text x="1048.7" y="320.4" class="mono val" fill="#e6edf3" text-anchor="middle">24</text>
  <text x="936.7" y="425" class="sans leg" fill="#6e7781" text-anchor="middle">assumed</text>
  <text x="1048.7" y="425" class="sans leg" fill="#a6e831" text-anchor="middle">measured</text>
  <text x="992.7" y="457" class="mono op" text-anchor="middle">I2FP + F2I</text>
  <text x="992.7" y="477" class="sans opsub" text-anchor="middle">conversion round trip</text>
  <text x="992.7" y="188" class="mono fac" text-anchor="middle">&#215;2</text>

  <line x1="52" y1="496" x2="1148" y2="496" stroke="#1c232c"/>
  <text x="52" y="520" class="mono note">python -m basalt.cli measure -o my-card.json  &#183;  RTX 5070 Ti, 70 SMs</text>
  <text x="1148" y="520" class="sans note" font-weight="700" text-anchor="end">every modelling error came from a control, never from reasoning</text>
</svg>
