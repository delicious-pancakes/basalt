      <rect x="382.8" y="0" width="6.1" height="28" rx="1.3"/><rect x="391.5" y="0" width="6.1" height="28" rx="1.3"/>
      <rect x="400.2" y="0" width="6.1" height="28" rx="1.3"/><rect x="408.9" y="0" width="6.1" height="28" rx="1.3"/>
