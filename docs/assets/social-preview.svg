        <rect x="522"   y="0" width="6.1" height="27" rx="1.2"/><rect x="530.7" y="0" width="6.1" height="27" rx="1.2"/>
        <rect x="539.4" y="0" width="6.1" height="27" rx="1.2"/><rect x="548.1" y="0" width="6.1" height="27" rx="1.2"/>
