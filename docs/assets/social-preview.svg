    <g fill="#2d333b">
      <rect x="1096.2" y="0" width="6.1" height="28" rx="1.3"/><rect x="1104.9" y="0" width="6.1" height="28" rx="1.3"/>
    </g>

    <!-- callouts: opcode on the left where the selector cells actually are -->
    <path d="M17.4 40 L17.4 47 L136.6 47 L136.6 40" fill="none" stroke="#5c7086" stroke-width="1.6"/>
    <text x="77" y="66" class="mono micro" text-anchor="middle" fill="#7d8fa3">OPCODE SELECTOR</text>

    <path d="M913.5 40 L913.5 47 L1093.6 47 L1093.6 40" fill="none" stroke="#76b900" stroke-width="1.8"/>
    <text x="1003.5" y="66" class="mono micro" text-anchor="middle" fill="#76b900">SCHEDULING CONTROL</text>
    <text x="1003.5" y="84" class="mono micro" text-anchor="middle" fill="#5e8f13">NEVER VALIDATED BY HARDWARE</text>
  </g>

  <!-- The hazard as a relation rather than an instance. An earlier version read
       "stall=2 < latency=6", which was not a pair this repository measured, and
       the corrected "stall=3 < IMAD latency=4" was measured but would go stale
       the moment another opcode or another card is characterised. A logo should
       outlive the measurements underneath it, and the invariant is what is
       actually being claimed: short the stall and the read is stale, whatever
       the numbers turn out to be. -->
  <g transform="translate(84 566)">
    <text x="0" y="0" class="mono hz" fill="#d29922">stall</text>
    <text x="62" y="0" class="mono" font-size="18" fill="#6e7781">&#60;</text>
    <text x="86" y="0" class="mono hz" fill="#f85149">latency</text>
    <text x="196" y="0" class="mono" font-size="18" fill="#8b949e">&#8594;  stale read, no fault, full speed</text>
  </g>

  <text x="84" y="606" class="mono tag">CLEAN-ROOM  ·  APACHE-2.0  ·  GITHUB.COM/SUNNYPATELL/BASALT</text>
</svg>
