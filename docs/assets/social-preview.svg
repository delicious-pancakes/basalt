    </g>
    <!-- bits 126..127 -->
    <g fill="#30363d">
      <rect x="1096.2" y="0" width="6.1" height="27" rx="1.2"/><rect x="1104.9" y="0" width="6.1" height="27" rx="1.2"/>
    </g>

    <path d="M913.5 39 L913.5 46 L1093.6 46 L1093.6 39" fill="none" stroke="#76b900" stroke-width="1.75"/>
    <text x="1003" y="66" class="mono micro" text-anchor="middle" fill="#76b900">SCHEDULING CONTROL — NEVER VALIDATED BY HARDWARE</text>
  </g>

  <!-- the hazard, stated in the artwork -->
  <g transform="translate(84 545)">
    <text x="0" y="0" class="mono hz" fill="#d29922">stall=2</text>
    <text x="86" y="0" class="mono" font-size="18" fill="#6e7781">&#60;</text>
    <text x="110" y="0" class="mono hz" fill="#f85149">latency=6</text>
    <text x="228" y="0" class="mono" font-size="18" fill="#8b949e">&#8594;  stale read, no fault, full speed</text>
  </g>

  <text x="84" y="596" class="mono tag">CLEAN-ROOM  ·  APACHE-2.0  ·  GITHUB.COM/SUNNYPATELL/BASALT</text>
