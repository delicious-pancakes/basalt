<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img"
     aria-label="basalt: the correctness layer for NVIDIA Blackwell GPU machine code. sm_120 has no hardware interlock, so one wrong stall count makes the GPU read a stale register and return a wrong answer silently.">
  <title>basalt — the correctness layer for NVIDIA Blackwell GPU machine code</title>

  <defs>
    <!-- basalt cools into interlocking hexagonal columns of near-uniform width,
         which is the same shape as a fixed-width instruction stream -->
    <pattern id="columns" width="112" height="130" patternUnits="userSpaceOnUse"
             patternTransform="translate(-18 -22)">
      <g fill="#151b23" stroke="#2b3542" stroke-width="1.4">
        <path d="M56 2 L106 30.5 L106 87.5 L56 116 L6 87.5 L6 30.5 Z"/>
        <path d="M0 67 L50 95.5 L50 152.5 L0 181 L-50 152.5 L-50 95.5 Z"/>
        <path d="M112 67 L162 95.5 L162 152.5 L112 181 L62 152.5 L62 95.5 Z"/>
      </g>
    </pattern>

    <!-- a mask reads luminance, so this has to run black to white rather than
         opaque to transparent; getting that backwards hides the pattern entirely -->
    <linearGradient id="fadeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.40" stop-color="#000000"/>
      <stop offset="0.68" stop-color="#5c5c5c"/>
      <stop offset="0.94" stop-color="#d8d8d8"/>
    </linearGradient>
    <!-- second axis so the pattern does not compete with the callouts along
         the bottom edge, where the smallest type sits -->
    <linearGradient id="fadeVert" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.00" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#ffffff"/>
      <stop offset="0.86" stop-color="#3a3a3a"/>
      <stop offset="1.00" stop-color="#000000"/>
    </linearGradient>
    <mask id="fadeMask">
      <g style="mask-type:luminance">
        <rect width="1280" height="640" fill="url(#fadeGrad)"/>
        <rect width="1280" height="640" fill="url(#fadeVert)" style="mix-blend-mode:multiply"/>
      </g>
    </mask>

    <radialGradient id="glow" cx="0.20" cy="0.30" r="0.85">
      <stop offset="0" stop-color="#1b2531" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76b900"/>
      <stop offset="1" stop-color="#a6e831"/>
    </linearGradient>

    <linearGradient id="hexGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#76b900" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#76b900" stop-opacity="0.06"/>
    </linearGradient>

    <style>
      .sans  { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif; }
      .mono  { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .wordmark { font-weight: 700; font-size: 106px; letter-spacing: -4px; fill: #e6edf3; }
      .lede  { font-weight: 600; font-size: 30px; fill: #e6edf3; letter-spacing: -0.3px; }
      .body  { font-weight: 400; font-size: 19px; fill: #8b949e; }
      .micro { font-size: 12.5px; fill: #6e7781; letter-spacing: 0.7px; }
      .tag   { font-size: 14px; fill: #566069; letter-spacing: 0.7px; }
      .hz    { font-size: 18px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="#0d1117"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect width="1280" height="640" fill="url(#columns)" mask="url(#fadeMask)"/>

  <!-- one column lit, the instruction the verifier is looking at -->
  <g opacity="0.95">
    <path d="M1038 128 L1088 156.5 L1088 213.5 L1038 242 L988 213.5 L988 156.5 Z"
          fill="url(#hexGlow)" stroke="#76b900" stroke-width="1.6" stroke-opacity="0.75"/>
  </g>

  <!-- wordmark -->
  <text x="84" y="178" class="sans wordmark">basalt</text>
  <rect x="87" y="202" width="116" height="5" rx="2.5" fill="url(#accent)"/>

  <text x="84" y="264" class="sans lede">The correctness layer for NVIDIA Blackwell</text>
  <text x="84" y="302" class="sans lede">GPU machine code.</text>

  <text x="84" y="354" class="sans body">sm_120 has no hardware interlock. One wrong stall count and the</text>
  <text x="84" y="381" class="sans body">GPU reads a stale register and returns a wrong answer, silently.</text>

  <!-- the 128-bit instruction word, bit 0 on the left -->
  <g transform="translate(84 442)">
    <text x="0" y="-13" class="mono micro">128-BIT INSTRUCTION WORD</text>

    <!-- bits 0..104: payload, with the opcode selector cells called out -->
    <g fill="#2d333b">
      <rect x="0" y="0" width="6.1" height="28" rx="1.3"/>
      <rect x="8.7" y="0" width="6.1" height="28" rx="1.3"/>
      <rect x="17.4" y="0" width="6.1" height="28" rx="1.3" fill="#5c7086"/>
