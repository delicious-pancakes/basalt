      <rect x="330.6" y="0" width="6.1" height="28" rx="1.3"/><rect x="339.3" y="0" width="6.1" height="28" rx="1.3"/>
      <rect x="348" y="0" width="6.1" height="28" rx="1.3"/><rect x="356.7" y="0" width="6.1" height="28" rx="1.3"/>
