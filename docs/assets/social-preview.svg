        <rect x="121.8" y="0" width="6.1" height="27" rx="1.2" fill="#48576a"/><rect x="130.5" y="0" width="6.1" height="27" rx="1.2" fill="#48576a"/>
      </g>
      <!-- bits 16..104 as a uniform field -->
      <g>
        <rect x="139.2" y="0" width="6.1" height="27" rx="1.2"/><rect x="147.9" y="0" width="6.1" height="27" rx="1.2"/>
