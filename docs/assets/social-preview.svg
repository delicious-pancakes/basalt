<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img"
     aria-label="basalt: the correctness layer for NVIDIA Blackwell GPU machine code. sm_120 has no hardware interlock, so one wrong stall count makes the GPU read a stale register and return a wrong answer silently.">
  <title>basalt — the correctness layer for NVIDIA Blackwell GPU machine code</title>

  <defs>
    <!-- basalt cools into interlocking hexagonal columns of near-uniform width,
         which is the same shape as a fixed-width instruction stream -->
    <pattern id="columns" width="104" height="120" patternUnits="userSpaceOnUse" patternTransform="translate(0 -14)">
      <g fill="#161c24" stroke="#28313c" stroke-width="1.25">
        <path d="M52 1 L98 28 L98 82 L52 109 L6 82 L6 28 Z"/>
        <path d="M0 61 L46 88 L46 142 L0 169 L-46 142 L-46 88 Z"/>
        <path d="M104 61 L150 88 L150 142 L104 169 L58 142 L58 88 Z"/>
      </g>
    </pattern>

    <linearGradient id="columnFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.30" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="0.62" stop-color="#0d1117" stop-opacity="0.55"/>
      <stop offset="1.00" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <mask id="fadeMask">
      <rect width="1280" height="640" fill="url(#columnFade)"/>
    </mask>

    <radialGradient id="glow" cx="0.24" cy="0.34" r="0.78">
      <stop offset="0" stop-color="#1b2430" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76b900"/>
      <stop offset="1" stop-color="#9ede2b"/>
    </linearGradient>

    <style>
      .sans  { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif; }
      .mono  { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .wordmark { font-weight: 700; font-size: 104px; letter-spacing: -3.5px; fill: #e6edf3; }
      .lede  { font-weight: 600; font-size: 31px; fill: #e6edf3; letter-spacing: -0.3px; }
      .body  { font-weight: 400; font-size: 19.5px; fill: #8b949e; }
      .micro { font-size: 13px; fill: #6e7781; letter-spacing: 0.4px; }
      .tag   { font-size: 14.5px; fill: #586069; letter-spacing: 0.6px; }
      .hz    { font-size: 18px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="#0d1117"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect width="1280" height="640" fill="url(#columns)" mask="url(#fadeMask)"/>

  <!-- wordmark -->
  <text x="84" y="176" class="sans wordmark">basalt</text>
  <rect x="86" y="200" width="112" height="5" rx="2.5" fill="url(#accent)"/>

  <text x="84" y="262" class="sans lede">The correctness layer for NVIDIA Blackwell</text>
  <text x="84" y="300" class="sans lede">GPU machine code.</text>

  <text x="84" y="352" class="sans body">sm_120 has no hardware interlock. One wrong stall count and the</text>
  <text x="84" y="379" class="sans body">GPU reads a stale register and returns a wrong answer, silently.</text>

  <!-- the 128-bit instruction word, bit 0 on the left -->
  <g transform="translate(84 436)">
    <text x="0" y="-11" class="mono micro">128-BIT INSTRUCTION WORD</text>
    <text x="1112" y="-11" class="mono micro" text-anchor="end" fill="#48576a">OPCODE SELECTOR</text>

    <g fill="#30363d">
      <!-- bits 0..104, drawn as a run then punched through for the selector -->
      <g id="payload">
        <rect x="0"    y="0" width="6.1" height="27" rx="1.2"/><rect x="8.7"  y="0" width="6.1" height="27" rx="1.2"/>
        <rect x="17.4" y="0" width="6.1" height="27" rx="1.2" fill="#48576a"/><rect x="26.1" y="0" width="6.1" height="27" rx="1.2"/>
        <rect x="34.8" y="0" width="6.1" height="27" rx="1.2" fill="#48576a"/><rect x="43.5" y="0" width="6.1" height="27" rx="1.2"/>
