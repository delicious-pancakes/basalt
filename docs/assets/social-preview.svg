    <!-- bits 105..125: the scheduling control section -->
    <g fill="url(#accent)">
      <rect x="913.5" y="0" width="6.1" height="28" rx="1.3"/><rect x="922.2" y="0" width="6.1" height="28" rx="1.3"/>
