<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560"
     role="img" aria-label="Measured cycles per instruction for each stall encoding on sm_120. A stall of 0 costs 36.85 cycles and is correct. Stalls of 1, 2 and 3 cost 4.88, 4.88 and 5.88 cycles and silently return the wrong answer. Stalls of 4, 8 and 15 cost 6.88, 10.88 and 18.02 and are correct.">
  <title>The stall cliff</title>

  <defs>
    <pattern id="cols" width="112" height="130" patternUnits="userSpaceOnUse"
             patternTransform="translate(-18 -34)">
      <g fill="#151b23" stroke="#2b3542" stroke-width="1.4">
        <path d="M56 2 L106 30.5 L106 87.5 L56 116 L6 87.5 L6 30.5 Z"/>
        <path d="M0 67 L50 95.5 L50 152.5 L0 181 L-50 152.5 L-50 95.5 Z"/>
        <path d="M112 67 L162 95.5 L162 152.5 L112 181 L62 152.5 L62 95.5 Z"/>
      </g>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.40" stop-color="#000000"/>
      <stop offset="0.74" stop-color="#4c4c4c"/>
      <stop offset="0.99" stop-color="#a8a8a8"/>
    </linearGradient>
    <mask id="fadeMask"><rect width="1200" height="150" fill="url(#fade)"/></mask>
    <radialGradient id="glow" cx="0.14" cy="0.5" r="0.85">
      <stop offset="0" stop-color="#1b2531" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6e831"/><stop offset="1" stop-color="#76b900"/>
    </linearGradient>
    <linearGradient id="bad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9b93"/><stop offset="1" stop-color="#f85149"/>
    </linearGradient>

    <style>
      .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .eyebrow { font-size: 12px; font-weight: 600; fill: #6e7781; letter-spacing: 2.2px; }
      .title   { font-size: 29px; font-weight: 700; fill: #e6edf3; letter-spacing: -0.9px; }
      .lede    { font-size: 15px; fill: #8b949e; }
      .mark    { font-size: 19px; font-weight: 700; fill: #5c7086; letter-spacing: -0.6px; }
      .axis    { font-size: 12.5px; fill: #6e7781; }
      .val     { font-size: 17px; font-weight: 700; }
      .tick    { font-size: 16px; font-weight: 700; fill: #8b949e; }
      .verdict { font-size: 12px; font-weight: 600; }
      .note    { font-size: 12.5px; fill: #6e7781; }
    </style>
  </defs>

  <rect width="1200" height="560" fill="#0d1117"/>
  <rect width="1200" height="150" fill="url(#glow)"/>
  <rect width="1200" height="150" fill="url(#cols)" mask="url(#fadeMask)"/>
  <rect x="0" y="0" width="5" height="560" fill="url(#ok)"/>

  <text x="52" y="52" class="mono eyebrow">FINDING 1 &#183; MEASURED ON SILICON</text>
  <text x="52" y="92" class="sans title">A stall of zero is not zero cycles, and 1 to 3 are wrong</text>
  <text x="52" y="120" class="sans lede">Cycles per instruction over a 128-link dependent IMAD chain, with the control bits patched directly.</text>
  <text x="1148" y="92" class="sans mark" text-anchor="end">basalt</text>
  <line x1="0" y1="150" x2="1200" y2="150" stroke="#2b3542"/>

  <g stroke="#1c232c">
    <line x1="166" y1="440" x2="1148" y2="440"/>
    <line x1="166" y1="380" x2="1148" y2="380"/>
    <line x1="166" y1="320" x2="1148" y2="320"/>
    <line x1="166" y1="260" x2="1148" y2="260"/>
    <line x1="166" y1="200" x2="1148" y2="200"/>
  </g>
  <g class="mono axis" text-anchor="end">
    <text x="154" y="444.5">0</text>
    <text x="154" y="384.5">10</text>
    <text x="154" y="324.5">20</text>
    <text x="154" y="264.5">30</text>
    <text x="154" y="204.5">40</text>
  </g>

  <rect x="311.9" y="186" width="415.1" height="254" rx="3"
        fill="#f85149" fill-opacity="0.07" stroke="#f85149" stroke-opacity="0.3"/>
  <text x="519.5" y="174" class="mono" font-size="11.5" font-weight="700" fill="#f85149"
        letter-spacing="2.4" text-anchor="middle">SILENTLY WRONG</text>

  <g>
    <rect x="215.4" y="218.9" width="86" height="221.1" rx="2" fill="url(#ok)"/>
    <rect x="352.3" y="410.7" width="86" height="29.3" rx="2" fill="url(#bad)"/>
    <rect x="489.1" y="410.7" width="86" height="29.3" rx="2" fill="url(#bad)"/>
    <rect x="626.0" y="404.7" width="86" height="35.3" rx="2" fill="url(#bad)"/>
    <rect x="762.9" y="398.7" width="86" height="41.3" rx="2" fill="url(#ok)"/>
    <rect x="899.7" y="374.7" width="86" height="65.3" rx="2" fill="url(#ok)"/>
    <rect x="1036.6" y="331.9" width="86" height="108.1" rx="2" fill="url(#ok)"/>
  </g>

  <g class="mono val" text-anchor="middle">
    <text x="258.4" y="206.9" fill="#e6edf3">36.85</text>
    <text x="395.3" y="398.7" fill="#ff9b93">4.88</text>
    <text x="532.1" y="398.7" fill="#ff9b93">4.88</text>
    <text x="669.0" y="392.7" fill="#ff9b93">5.88</text>
    <text x="805.9" y="386.7" fill="#e6edf3">6.88</text>
    <text x="942.7" y="362.7" fill="#e6edf3">10.88</text>
    <text x="1079.6" y="319.9" fill="#e6edf3">18.02</text>
  </g>

  <g class="mono tick" text-anchor="middle">
    <text x="258.4" y="467">0</text>
    <text x="395.3" y="467">1</text>
    <text x="532.1" y="467">2</text>
    <text x="669.0" y="467">3</text>
    <text x="805.9" y="467">4</text>
    <text x="942.7" y="467">8</text>
    <text x="1079.6" y="467">15</text>
  </g>

  <g class="sans verdict" text-anchor="middle">
    <text x="258.4" y="487" fill="#a6e831">correct</text>
    <text x="395.3" y="487" fill="#f85149">wrong</text>
    <text x="532.1" y="487" fill="#f85149">wrong</text>
    <text x="669.0" y="487" fill="#f85149">wrong</text>
    <text x="805.9" y="487" fill="#a6e831">correct</text>
    <text x="942.7" y="487" fill="#a6e831">correct</text>
    <text x="1079.6" y="487" fill="#a6e831">correct</text>
  </g>

  <line x1="52" y1="516" x2="1148" y2="516" stroke="#1c232c"/>
  <text x="52" y="540" class="mono note">python -m basalt.cli probe-stalls  &#183;  RTX 5070 Ti, CUDA 13.3.1</text>
  <text x="1148" y="540" class="sans note" font-weight="700" text-anchor="end">the three fastest encodings are the broken ones</text>
</svg>
