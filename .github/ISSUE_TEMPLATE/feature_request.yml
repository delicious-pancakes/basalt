name: Feature request
description: Suggest something basalt should be able to do
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to find out or verify
      description: The underlying question, rather than the feature you have in mind for it.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you think basalt should do
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: How would anyone know it was right
      description: |
        basalt reports measurements, so a new capability needs a way to check it. What would
        the positive control be, and what would falsify the result?
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I have read the out-of-scope section of docs/ROADMAP.md and this is not in it.
          required: false
