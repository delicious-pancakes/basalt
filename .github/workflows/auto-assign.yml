#
# One maintainer, so every new issue has a known owner from the moment it is
# filed rather than sitting unassigned and looking unread.
name: auto-assign

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  assign:
    name: Assign to the maintainer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: ['sunnypatell'],
            });
