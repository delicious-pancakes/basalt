name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  unit:
    # the pure unit tests touch no NVIDIA binary, so they run everywhere and
    # stay the fast signal on every push
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -m "not toolchain and not gpu"

  oracles:
    # the full pipeline needs ptxas and nvdisasm but no GPU, which is the whole
    # reason the ISA database is reproducible in CI at all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Cache the pinned CUDA redistributables
        uses: actions/cache@v4
        with:
          path: third_party/cuda/_archives
          key: cuda-redist-${{ hashFiles('scripts/fetch_toolchain.py') }}

      - name: Fetch the pinned toolchain
        run: python scripts/fetch_toolchain.py

      - name: Verify both oracles
        run: |
          echo "BASALT_CUDA_BIN=$PWD/third_party/cuda/13.3.1/bin" >> "$GITHUB_ENV"
          BASALT_CUDA_BIN="$PWD/third_party/cuda/13.3.1/bin" python -m basalt.cli doctor

      - name: Run the toolchain-marked tests
        run: pytest -m "toolchain and not slow"

      - name: Positive control over the whole corpus
        # every kernel ptxas builds from the corpus must verify clean. this is
        # the check that decides whether anything else basalt reports is worth
        # reading, so it runs on every push rather than on a schedule.
        run: pytest -m slow

      - name: Rebuild the ISA database and check it against the committed copy
        # the database is generated data. if a ptxas update changes what we
        # observe, this job is where that shows up, loudly, instead of drifting.
        run: |
          python -m basalt.cli build-isa -o /tmp/rebuilt.json
          python scripts/compare_isa.py data/isa/sm_120a.json /tmp/rebuilt.json
