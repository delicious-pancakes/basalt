name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # the ISA drift check is the slow job and does not need to gate a push; a
    # nightly run catches a compiler update within a day, which is soon enough
    - cron: "23 4 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # superseded pull-request runs are wasted minutes, but a cancelled run on main
  # leaves the branch with no recorded status, so those are left to finish
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CUDA_VERSION: "13.3.1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # the same pinned ruff and mypy the dev extra and pre-commit use, so the
      # gate cannot move under a contributor between their machine and here
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # a checker whose own types are unchecked is a poor advertisement for one.
      # both platforms from the one runner, because the driver loads a different
      # library on each and only the host's branch would otherwise be looked at:
      # `ctypes.WinDLL` does not exist on Linux and this is where that shows up
      - run: mypy --platform linux
      - run: mypy --platform win32

  unit:
    # the pure unit tests touch no NVIDIA binary, so they run everywhere and
    # stay the fast signal on every push
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          # windows gets one leg rather than three. what actually differs there
          # is `os.name == "nt"` choosing the .exe suffix in toolchain discovery
          # and platform_key() in the fetcher, and neither varies by python
          # version. the driver's WinDLL branch is not covered by this matrix at
          # all: it sits behind the gpu marker, and `mypy --platform win32` in
          # the lint job is what checks it.
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -m "not toolchain and not gpu and not slow"

  oracles:
    # needs ptxas and nvdisasm but no GPU, which is the whole reason the
    # instruction database and the checker are reproducible by anyone
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"

      - name: Cache the pinned CUDA redistributables
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/cuda/_archives
          key: cuda-redist-${{ env.CUDA_VERSION }}-${{ hashFiles('scripts/fetch_toolchain.py') }}

      - name: Fetch the pinned toolchain
        run: |
          python scripts/fetch_toolchain.py
          echo "BASALT_CUDA_BIN=$PWD/third_party/cuda/$CUDA_VERSION/bin" >> "$GITHUB_ENV"

      - name: Verify both oracles
        run: python -m basalt.cli doctor

      - name: Run the toolchain-marked tests
        run: pytest -m "toolchain and not slow"

      - name: Positive control over the whole corpus
        # every kernel ptxas builds must verify clean. this is the check that
        # decides whether anything else basalt reports is worth reading, so it
        # gates every push rather than running on a schedule.
        run: pytest -m slow

      - name: Try to make the assembler emit something else
        # the coverage run only asks about text ptxas chose to emit. this goes
        # looking, and it found four real defects the corpus never reached
        run: |
          for seed in 1 2 3; do
            python scripts/fuzz_assembler.py --cases 60 --seed "$seed"
          done

      - name: Reproduce the assembler number the README quotes
        # the suite already pins "nothing assembles to the wrong bytes"; this
        # prints the figure itself, so a drop in coverage is visible in the log
        # rather than only when it crosses the floor, and the script that
        # produces the published number cannot quietly stop working
        run: python scripts/assembler_coverage.py

  isa-drift:
    # Rebuilding the database takes minutes and answers a different question:
    # has the compiler changed what it emits. That does not need to gate a push,
    # so it runs on pull requests and nightly instead of on every commit.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"

      - name: Cache the pinned CUDA redistributables
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/cuda/_archives
          key: cuda-redist-${{ env.CUDA_VERSION }}-${{ hashFiles('scripts/fetch_toolchain.py') }}

      - name: Fetch the pinned toolchain
        run: |
          python scripts/fetch_toolchain.py
          echo "BASALT_CUDA_BIN=$PWD/third_party/cuda/$CUDA_VERSION/bin" >> "$GITHUB_ENV"

      - name: Rebuild the ISA database and compare it with the committed copy
        # the database is generated data that is nonetheless committed, so that
        # a consumer needs no harvest. that trade only works if drift is loud.
        run: |
          python -m basalt.cli build-isa -o /tmp/rebuilt.json
          python scripts/compare_isa.py data/isa/sm_120a.json /tmp/rebuilt.json

      - name: Check the measured fields still behave
        run: python -m basalt.cli validate-isa --show
