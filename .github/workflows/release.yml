#
# Builds the distributions for a tagged release and attaches cryptographic
# provenance to them.
#
# The provenance is the point. basalt's whole argument is that a claim without
# evidence is worth nothing, and "these are the files I built from that commit"
# is a claim like any other. The build itself lives in release-build.yml, a
# reusable workflow with its own isolated identity, which is what makes the
# Sigstore statement SLSA Build L3 rather than L2. Anyone can then check that a
# wheel came from this repository, this commit and that builder, rather than
# taking the release page's word for it:
#
#     gh attestation verify basalt-<version>-py3-none-any.whl \
#       --repo sunnypatell/basalt \
#       --signer-workflow sunnypatell/basalt/.github/workflows/release-build.yml
#
# This file only orchestrates: it calls the builder, then publishes what came
# back. The split is the least-privilege boundary. `contents: write` exists in
# the publish job and nowhere near the code that compiles, tests and signs.
#
# Nothing is published to an index from here. That is a deliberate separation:
# a release should be reproducible and verifiable before it is distributed, and
# wiring publication into the same run makes it harder to stop one without
# stopping the other.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "tag or commit to build"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build and attest
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      ref: ${{ inputs.ref || github.ref }}

  publish:
    name: Attach to the release
    needs: build
    # only a real tag gets published; a manual run against an arbitrary commit
    # still builds and attests, so the pipeline can be exercised without
    # producing a release nobody asked for
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the only place in this pipeline that can write a release
    steps:
      - name: Collect what the builder produced
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist

      # created here only if the tag was pushed without one, so the pipeline
      # cannot fail at the last step for a reason nobody would guess. A real
      # release is written by hand first and this leaves it alone.
      - name: Attach everything to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber --repo "$REPO"
