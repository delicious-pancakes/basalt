#
# basalt ships with no runtime dependencies, which is a deliberate constraint
# rather than an accident: the pipeline shells out to ptxas and nvdisasm and
# parses text, so the ISA database can be rebuilt from a pinned redistributable
# and nothing else.
#
# This job is what keeps that true. A pull request that adds a runtime
# dependency has to argue for it in review instead of arriving quietly in a
# diff, and the same pass checks the licence of anything new against the
# clean-room position in NOTICE.
name: dependency-review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # a dependency whose terms are unstated is exactly the kind of thing
          # this project cannot take on trust
          deny-licenses: GPL-3.0, AGPL-3.0, LGPL-3.0
          comment-summary-in-pr: on-failure
